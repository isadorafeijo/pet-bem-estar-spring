<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet Bem-Estar - Cadastro de Animal</title>
    <link rel="stylesheet" th:href="@{/css/petshop.css}">
</head>
<body>

<header class="cabecalho">
    <a th:href="@{/paginas/tutores}">
        <img th:src="@{/img/logo.jpg}" alt="Pet Bem-Estar" class="logo">
    </a>
    <div class="usuario" th:if="${session.usuarioLogado}">
        Usuário: <span th:text="${session.usuarioLogado.nomeUsuario}">maria</span>
        <a th:href="@{/sair}">Sair</a>
    </div>
</header>

<main class="container">
    <h1 th:text="${pet.id == null ? 'Cadastrar Animal' : 'Editar Animal'}">Cadastro de Animal</h1>

    <form th:object="${pet}"
          th:action="${pet.id == null ? '/paginas/pets/novo' : '/paginas/pets/editar/' + pet.id}"
          method="post">

        <input type="hidden" th:field="*{id}">

        <div class="mensagens-erro" th:if="${#fields.hasErrors('*')}">
            <p><strong>Não foi possível salvar o animal.</strong></p>
            <ul>
                <li th:each="erro : ${#fields.errors('*')}" th:text="${erro}">Mensagem</li>
            </ul>
        </div>

        <div class="campo">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" th:field="*{nome}" required maxlength="100">
        </div>

        <div class="campo">
            <label for="tutor">Tutor:</label>
            <select id="tutor" th:field="*{tutor.id}" required>
                <option value="">Selecione o tutor</option>
                <option th:each="t : ${tutores}" th:value="${t.id}" th:text="${t.nome}"></option>
            </select>
        </div>

        <div class="campo">
            <label for="especie">Espécie:</label>
            <select id="especie" th:field="*{especie}" required>
                <option value="">Selecione a espécie</option>
                <option th:each="e : ${especies}" th:value="${e}" th:text="${e}"></option>
            </select>
        </div>

        <div class="campo">
            <label for="porte">Porte:</label>
            <select id="porte" th:field="*{porte}" required>
                <option value="">Selecione o porte</option>
                <option th:each="p : ${portes}" th:value="${p}" th:text="${p}"></option>
            </select>
        </div>

        <div class="botoes-formulario">
            <button type="submit" class="btn btn-principal"
                    th:text="${pet.id == null ? 'Cadastrar' : 'Salvar alterações'}">Salvar</button>
            <a th:href="@{/paginas/pets}" class="btn btn-secundario">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
