<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet Bem-Estar - Ficha do cliente</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>
<main class="container">
    <h1 th:text="${tutor.nome}">Nome do cliente</h1>

    <p><strong>Telefone:</strong> <span th:text="${tutor.telefone}"></span></p>

    <h2>Animais</h2>

    <p th:if="${pets.isEmpty()}">Nenhum animal cadastrado para este cliente.</p>

    <table th:if="${!pets.isEmpty()}">
        <thead>
            <tr>
                <th>Nome</th>
                <th>Espécie</th>
                <th>Porte</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="pet : ${pets}">
                <td th:text="${pet.nome}">Nome</td>
                <td th:text="${pet.especie}">Espécie</td>
                <td th:text="${pet.porte}">Porte</td>
            </tr>
        </tbody>
    </table>

    <a th:href="@{/paginas/tutores}" class="botao">Voltar</a>
</main>
</body>
</html>
