<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet Bem-Estar - Ficha do cliente</title>
    <link rel="stylesheet" th:href="@{/css/petshop.css}">
</head>
<body>

<header class="cabecalho">
    <a th:href="@{/paginas/tutores}">
        <img th:src="@{/img/logo.jpg}" alt="Pet Bem-Estar" class="logo">
    </a>
    <div class="usuario" th:if="${session.usuarioLogado}">
        Usuário: <span th:text="${session.usuarioLogado.nomeUsuario}">maria</span>
        <a th:href="@{/sair}">Sair</a>
    </div>
</header>

<main class="container">
    <h1 th:text="${tutor.nome}">Nome do cliente</h1>

    <p><strong>Telefone:</strong> <span th:text="${tutor.telefone}"></span></p>

    <h2>Animais</h2>

    <p class="vazio" th:if="${pets.isEmpty()}">Nenhum animal cadastrado para este cliente.</p>

    <table th:if="${!pets.isEmpty()}">
        <thead>
            <tr>
                <th>Nome</th>
                <th>Espécie</th>
                <th>Porte</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="pet : ${pets}">
                <td th:text="${pet.nome}">Nome</td>
                <td th:text="${pet.especie}">Espécie</td>
                <td th:text="${pet.porte}">Porte</td>
            </tr>
        </tbody>
    </table>

    <p>
        <a th:href="@{/paginas/tutores}" class="botao">Voltar</a>
    </p>
</main>
</body>
</html>
