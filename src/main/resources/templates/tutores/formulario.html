<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cadastro de Tutor</title>

<link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>

<body>

	<main class="container">

		<h1 th:text="${tutor.id == null ? 'Cadastrar Tutor' : 'Editar Tutor'}">
			Cadastro do Tutor</h1>

		<form th:object="${tutor}"
			th:action="${tutor.id == null ? '/paginas/tutores/novo' : '/paginas/tutores/editar/' + tutor.id}"
			method="post">

			<input type="hidden" th:field="*{id}">

			<div class="mensagens-erro" th:if="${#fields.hasErrors('*')}">

				<p>
					<strong>Não foi possível salvar o tutor.</strong>
				</p>

				<ul>
					<li th:each="erro : ${#fields.errors('*')}" th:text="${erro}">
						Mensagem de erro</li>
				</ul>

			</div>

			<div class="campo">

				<label for="nome">Nome:</label> <input type="text" id="nome"
					th:field="*{nome}" maxlength="120" required
					placeholder="Nome do cliente" autocomplete="name"> <span
					class="erro-campo" th:if="${#fields.hasErrors('nome')}"
					th:errors="*{nome}"> </span>

			</div>

			<div class="campo">

				<label for="telefone">Telefone:</label> <input type="tel"
					id="telefone" th:field="*{telefone}" maxlength="30" required
					placeholder="(00) 00000-0000" autocomplete="tel"> <span
					class="erro-campo" th:if="${#fields.hasErrors('telefone')}"
					th:errors="*{telefone}"> </span>

			</div>
			
			<div class="campo">

				<label for="email">E-mail:</label> <input type="email"
					id="email" th:field="*{email}" maxlength="150"
					placeholder="exemplo@email.com" autocomplete="email"> <small>
					Informe um endereço de e-mail válido. </small> <span
					class="erro-campo" th:if="${#fields.hasErrors('email')}"
					th:errors="*{email}"> </span>

			</div>

			<div class="botoes-formulario">

				<button type="submit" class="btn btn-principal"
					th:text="${tutor.id == null ? 'Cadastrar' : 'Salvar alterações'}">
					Salvar</button>

				<a th:href="@{/paginas/tutores}" class="btn btn-secundario">
					Cancelar </a>

			</div>

		</form>

	</main>

</body>
</html>
